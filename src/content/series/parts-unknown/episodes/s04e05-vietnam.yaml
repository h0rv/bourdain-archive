summary: "Bourdain visits the former Vietnamese Imperial capital of Huế in Central Vietnam, the nation's spiritual, cultural and culinary capital, where he tries local specialties such as Bún bò Huế, Cơm hến (clams with rice topped with clam broth & pork rinds), Bánh bèo and Bánh bột lọc (cassava flour cakes topped with pan-fried shrimp, pork belly & green onions) at street-side vendors and restaurants. He visits Đông Ba Market, a local artist's home sampling Vietnamese imperial court cuisine, a local fishing village, and the communist Vịnh Mốc tunnels north of the former DMZ. Anthony revisits the 1968 Tet Offensive, including the Battle of Huế and the Huế Massacre, where 3000 civilians were massacred by the Viet Cong."
