summary: "Drawing inspiration from iconic Hungarian born cinematographer Vilmos Zsigmond, Bourdain explores the beauty, culture, history, architecture and food of Budapest. The culinary dishes sampled during his journey include goulash, fisherman’s soup, blood sausage, stuffed cabbage and, during a stop at restaurant Pleh Csarda, a golden brown pancake heaped with chicken liver and bone marrow, fried schnitzel and venison stew."
