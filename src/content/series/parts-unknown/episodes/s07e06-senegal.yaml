summary: "Bourdain explores the distinct culture of the West African nation Senegal, which despite its deep-rooted religious beliefs, is known for its nightlife, global musical influence, vibrant fashion scene, rich food culture and history of tolerance. Featured guides on this journey include Chef Pierre Thiam, NPR Africa correspondent Ofeibea Quist Arcton, and famed musician Youssou N'Dour, for conversation and a taste of maffe, a much loved rich beef stew, popular throughout West Africa."
