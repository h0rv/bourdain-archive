summary: "An alternative tour of Los Angeles by Bourdain focuses on the impact and contributions of its less photographed and often overlooked Latino communities. From downtown, for Oaxaqueno specialties at Gish Bac and redefined Mexican food from chef Ray Garcia at Broken Spanish, to Hollywood, for a health-conscious but savory dinner with actor Danny Trejo (Machete) at Trejo's Cantina, the host experiences this vibrant culture against a backdrop of LA glamour."
