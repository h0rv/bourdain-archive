summary: "Acclaimed chef Marcus Samuelsson (Red Rooster, Aquavit) and his wife Maya take Bourdain on a personal tour of their native country to experience this nation beyond the headlines, first in Addis Adaba where they sample injera bread and beyaynetu platters, followed by drinking Turbo and eating Tibs with local skateboarding pioneers, listening to the traditional music of Azmari singers and legendary Ethiopian-jazz musician, Mahmoud Ahmed, a sampling Ethiopian coffee and a village feast with Maya's family in the Gurage region."
