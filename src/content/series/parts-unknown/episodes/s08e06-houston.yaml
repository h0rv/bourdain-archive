summary: "Looking beyond oil, NASA, and football, Tony showcases the extreme ethnic diversity of Houston, Texas. Anthony visits the Little India neighborhood; attends a quinceañera, meets with refugee students at Lee High School, as well as the principal, himself a former Vietnamese refugee; explores African-American \"slab\" car culture with rapper Slim Thug; meets Vietnamese fishermen and Congolese farmers; and attends an Indian cricket game."
