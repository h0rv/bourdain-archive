summary: 'Anthony travels to "Big Sky Country" Montana, and its tranquil lifestyle. Tony visits the Crow Indian Reservation to view a traditional horse relay race. Later, Tony goes on a pheasant hunt with comedian/MMA color commentator Joe Rogan. From there, Bourdain takes part in a Butte institution the Supper club, then traverses the Orphan Boy mine. Bourdain spends time with an old friend, the late American writer Jim Harrison, whom the episode is dedicated to.'
