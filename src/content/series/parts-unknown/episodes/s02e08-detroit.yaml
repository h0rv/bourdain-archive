summary: "Few cities have experienced such a dramatic economic rise and fall of Detroit. In this episode of Parts Unknown, Bourdain explores the past, present and future of the Motor City. He steps into the lives of Detroit natives and sees the glory days of the past at the famed Packard Plant, the current state of the city's urban decay, and the promise of the future in the citizens who are rebuilding their communities."
