summary: "Leaving behind the Africa we've come to know in the news — full of corruption, poverty and conflict — Tony embraces the wild, untamed continent of mystery, adventure and exoticism during a visit to Tanzania. Bourdain visits Zanzibar, a one-time slave trade hub, and enjoys the island's famous foods, from mandazi to street food including grilled seafood and the famous Zanzibari pizza. On an excursion to the Serengeti and Ngorongoro Crater, Bourdain comes face to face with lions, elephants, and the great migration."
