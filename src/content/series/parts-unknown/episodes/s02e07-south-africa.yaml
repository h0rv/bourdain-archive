summary: "Once considered the most dangerous city in the world, Johannesburg now barely makes the top 50. But the end of the apartheid has led to vast changes in the city. In this episode, Bourdain visits the suburb of Hillbrow (which remains a dangerous locale), spends a day in the life of a taxi driver and discovers the culture and food that make up modern day Johannesburg."
