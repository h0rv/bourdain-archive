summary: "The show takes a close look at the mash-up of cultures that comprise this uniquely American state. Tony and crew sample New Mexico's food — a combination of Spanish, Mediterranean, Mexican, Pueblo and even chuck-wagon influences. New Mexico is also a land of drugs, guns, monster vehicles, and possibly extraterrestrials. It may also be the perfect place to investigate the underside of the Western cowboy ideal."
