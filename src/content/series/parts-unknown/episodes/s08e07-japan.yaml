summary: "Bourdain explores Japan with Michelin star chef Masa Takayama for a homecoming of sorts, especially Ishikawa Prefecture and Tochigi Prefecture. They indulge in both seafood and mainland produce done in numerous ways with simplicity and reflection of Japanese striving spirit. Bourdain is also given a masterclass on umami and its closeness to the flow of life in general, and sees how these Japanese experiences shaped and molded his friend Masa. Their trip comes full circle with a special omakase experience at Tokyo's acclaimed Ginza restaurant, Sushi Koi, where Masa trained as an apprentice."
