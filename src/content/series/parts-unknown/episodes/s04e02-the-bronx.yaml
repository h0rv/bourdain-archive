summary: "Anthony Bourdain explores the rich cultural diversity and unique variety of cuisines the Bronx has to offer. From the Bronx's role in the birth of hip-hop to traditional Jamaican tonics to deep fried pig parts, Tony unearths the energy, vibe and rhythm of this oft overlooked borough of New York City. Bronx mainstays Afrika Bambaataa, Mellle Mel, and Baron Ambrosia help guide the host through the music, food, art, and other offerings of this often misunderstood part of the city."
