summary: "Bourdain has traveled to Tokyo countless times, but on this trip he is in search of the city's dark, extreme, and bizarrely fetishistic underside. Japan is a paradox. The low birthrate, the dedication, the conformity, and the life of a salary man are well known. There is also a competitive and rigid culture that gives way to some unique subcultures. A significant portion of the episode is spent with sushi chef Yasuda."
