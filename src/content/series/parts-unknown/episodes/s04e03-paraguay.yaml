summary: 'A South American country of 6 million, much of the oppressively hot landlocked nation of Paraguay is jungle terrain or desert known as "the Chaco." An investigation into the puzzling history of the host''s great, great, great, grandfather, Paraguayan émigré Jean Bourdain, is a springboard to his first tour of this South American country, primarily comprised of jungle and desert land, which features a rich culture and savory local dishes that include Bife Koygua, Bori Bori, and Sopa Paraguaya.'
