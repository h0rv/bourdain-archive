summary: "Bourdain's Roman holiday takes a cinematic turn, influenced by his tour guides, actress Asia Argento, screenwriter/director Abel Ferrara, and a host of larger than life Romans who take him inside a Rome for the locals. Bourdain shares drinks at the 'Friends Corner' trattoria in Lido di Ostia, dines a traditional Roman meal at Trattoria Morgana, eats pasta and watches an amateur boxing match in the suburbs, and takes a trip to the famed E.U.R zone built by Mussolini."
