summary: 'Bourdain explores the Brazilian heartland, known as the region where all the best cooks come from, and namesake to the country''s mining history. Home to baroque architecture, lush hillsides and mineiro cuisine (influenced by Portuguese, African and Indigenous people), which includes the "infamous" pequi fruit, cachaça, feijão tropeiro (cattleman''s beans), blood sausage and mocotó. He meets with an Afro-Brazilian family and discusses the vast African influence on Mineiro culture. He also visits the giant contemporary art museum Inhotim, and talks to its founder, eccentric mining magnate Bernardo Paz.'
