summary: "Bourdain visits Charleston, home to renowned Chef Sean Brock, who takes Bourdain to the Waffle House where the duo enjoy a late-night sampling of Waffle House fare. Later, they attend a Charleston RiverDogs game with actor Bill Murray; Murray accompanies them to Brock's restaurant Husk where the restaurant's innovative-yet-traditional Southern cooking is put on display. They also explore traditional Gullah cuisine on James Island. Brock introduces Bourdain to a unique commercial fishing venture based in Charleston harbor, as well as Scott's Pit BBQ owned and operated by Rodney Scott in Hemingway, South Carolina."
