summary: "Bourdain takes his first journey to the Sultanate of Oman and finds a peaceful land of remarkable beauty that defies expectations. His travels include the capital city Muscat, as well as port city Muttrah to restaurant Bait Al Luban for shuwa, a special dish made from the complex process of cooking meat buried in the ground for days over hot coals, and Sharqiya Sands, on the edge of the Empty Quarter, to dine with the local Bedouins who inhabit the world's largest sand desert."
