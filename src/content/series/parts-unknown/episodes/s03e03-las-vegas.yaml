summary: "Bourdain travels to Las Vegas, a city known for over-indulgence, with food author Michael Ruhlman and visits locales that include Huntridge Tavern (in the shadow of the strip), Lotus of Siam with chef Jet Tila and famed restaurant by Jose Andres. Tony dines with Penn Jillette to discuss the ever changing entertainment landscape in Las Vegas. Former mayor Oscar Goodman talks about old gangsters and old Vegas. Professional poker players Erick Lindgren and Erica Schoenberg play cards with Tony and Michael."
