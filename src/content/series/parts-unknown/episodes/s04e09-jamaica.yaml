summary: "Bourdain visits the coastal city of Port Antonio and meets with billionaire businessman Michael Lee-Chin and his business partner, Jon Baker, who are attempting to increase tourism to the area. He then visits Goldeneye, James Bond novelist Ian Fleming's estate, and nearby James Bond Beach, and has dinner with Goldeneye's current owner, legendary music producer Chris Blackwell. He also meets with various locals, and enjoys local dishes such as jerk chicken, curry goat and ackee and saltfish, while discussing the tensions between rich and poor, and tourists and locals, on the island. Parts of the episode have a soundtrack reminiscent of James Bond films of the 1960s."
