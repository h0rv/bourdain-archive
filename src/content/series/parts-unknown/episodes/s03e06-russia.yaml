summary: "On the eve of the Olympic games in Sochi, Bourdain takes his first trip in nearly 10 years to Russia, accompanied by his longtime traveling partner Zamir Gotta. Looking through the lens of a now Putin-controlled Russia, Bourdain confers with prominent locals, visits Moscow's historic Metropol Hotel, takes the Grand Express train to St. Petersburg, and explores the drinking and dining scene. One of the \"prominent locals\" who expresses criticism of Putin on the show is opposition politician Boris Nemtsov, who was assassinated in February 2015."
