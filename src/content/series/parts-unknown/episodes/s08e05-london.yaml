summary: "Tony returns to London, a bastion of pro-European Union sentiment, now facing an uncertain future after the dramatic Brexit vote. Bourdain delves into the traditional strengths of London food culture with chefs like Nigella Lawson, Marco Pierre White and Fergus and Margot Henderson. Cartoonist Ralph Steadman discusses his work, as well as his thoughts on Brexit. Bourdain enjoys a chip butty for the first time with Marco, and has a late-night snack with guitarist Jamie Hince of The Kills."
