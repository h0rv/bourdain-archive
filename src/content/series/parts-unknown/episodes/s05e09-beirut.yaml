summary: "The season five finale takes the host back to Beirut. Nicknamed “The Paris of the Middle East,” its nightlife is infamous, the population beautiful, and its cuisine legendary. During his travels, Bourdain meets up with freestyle artist Double A The Preecherman in the Mar Mikhael neighborhood, has a classic Lebanese meal with writer, publisher, activist Joumana Haddad, and visits a Syrian community in southern Beirut with CNN correspondent Nick Paton Walsh."
