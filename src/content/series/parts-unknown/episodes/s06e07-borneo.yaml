summary: "Bourdain returns to Borneo after 10 years to fulfill his promise. Tracing back the memories he had left behind that 10 years ago of him with one of the largest indigenous group in Borneo, the Dayaks while he revisits the Dayak Iban longhouse which welcomed him with an open arm, heart and soul back then. He is there to celebrate the Harvest Festival Gawai with the Ibans, and acquires a new hand-tapped tattoo. Not forgetting his favourite breakfast ever Laksa Sarawak in the capital city Kuching the Borneo Sarawak in East Malaysia."
