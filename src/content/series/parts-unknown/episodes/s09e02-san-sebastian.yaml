summary: "Bourdain visits the coastal city of San Sebastian in the Basque Country, famous for its spectacular views and incomparable fresh seafood. Alongside friend and renowned chef Juan Mari Arzak, Bourdain dines at favorite haunt Ganbara for its popular dish of seared wild mushrooms and foie gras with raw egg yolk, and is given a taste of the finest Basque delicacies prepared simply, including grilled turbot at famed restaurant Elkano, in Getaria."
