summary: "Reverse chronology is used to tell the story of Tony’s return trip to South Korea after a 10-year absence. He experiences the nuances of hyper-modern Seoul which has its sights set on becoming the world’s top exporter of popular culture. Food options include Korean fried chicken, and a vintage Korean “army” stew, budae jjigae, with Spam, canned baked beans, frankfurters, ramen noodles and Kimchi."
