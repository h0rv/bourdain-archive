summary: "Bourdain travels to his childhood home state with his brother Chris and rekindles memories at classic roadside joint Hiram’s, known for its fried hotdogs, and Barnegat Light in Ocean County. He heads further down the shore to Atlantic City and stops by the Knife and Fork, Docks Oyster House with local reporter Brian Donohue, the Baltimore Grill to see husband and wife comedians Rich Vos and Bonnie McFarlane, and tours Asbury Park with none other than famed musician Southside Johnny. Trips to Camden and the Pine Barrens are included as well."
