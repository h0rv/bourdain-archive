summary: "Sidekick Zamir Gotta temporarily upstages Bourdain in this tour of the mountainous Eurasian country Georgia, featuring the cities Tbilisi, Batumi, and Khurvaleti (bordering Russia), with traditional dishes that include spicy chashashuli stew, chkmeruli at Café Gabriadze and an epic meal at the Black Lion. On the political front, acclaimed journalist Tamara Chergoleishvili (Tabula magazine editor-in-chief) offers Bourdain an insider's POV of her country's changing views."
