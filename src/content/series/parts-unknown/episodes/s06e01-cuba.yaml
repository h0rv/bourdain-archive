summary: "Bourdain explores Cuba - just as the half-century U.S. embargo softens and economic and social progress loom - from its bustling capital city Havana, to the slower paced, music mecca Santiago. Sampled food includes pig's head soup with plantains and pumpkin, flan in a beer can, and dogfish ceviche with pickled vegetables. The tour culminates with a dialogue-free tracking shot capturing the hopeful anxiety of its people, seemingly waiting for something to start."
