summary: "Life on the Greek islands, home to a fiercely independent and proud population, is relatively secluded, steeped in tradition, and revolves around local food, wine, close friends and family. On theisland of Naxos, Bourdain heads offshore to dive to a sunken ship wreck,drink raki with the local residents, and sample cuisine fresh from the fishing boat, including octopus salad, salatouri (skate), and rofos (grouper) with olive oil and lemon. While exploring the island, he meets with politically outspoken musical group, The Stray Bitches, and travels to the mountainous village of Apeiranthos where he attends a traditional celebration in the town square."
