summary: "It is Christmas time, and a typhoon has forced Tony and crew to stay in Manila instead of venturing further out. Tony enjoys local specialties like sizzling sisig and halo-halo, explores the phenomenon of the Phiippines' internationally-famous cover bands, and meets with the former nanny of one of the show's producers, who, though now retired, spent much of her life abroad caring for other people's children in order to provide for her own family. The episode is notable for a Tagalog-language cover of the series' intro theme."
