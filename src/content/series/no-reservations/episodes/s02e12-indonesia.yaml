summary: "Bourdain visit Jakarta where he is entertained by Pencak Silat martial art where performers showcased their ability to withstood torture, which shocked Bourdain. Then he enjoyed Padang cuisine, including the famed Rendang. During the shooting, the cameraman accidentally wrecked the stacked food plates on display. He then visit Garut where he watch Ram fighting, joining traditional dance and enjoying local cuisine, before relaxing at id:Kampung Sampireun Hotel Garut. He then travel to Bali to enjoy its famous delicacy Babi Guling."
