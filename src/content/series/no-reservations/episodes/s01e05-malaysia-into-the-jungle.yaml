summary: 'Tony has always had an interest in "natural fusion" or the way cuisines intertwine with cultures over the course of history. In Kuala Lumpur, Malaysia, this is particularly true as a variety of cultures have blended. Chef Wan gives Tony a tour of a wet market and hawker stalls in Kuala Lumpur. Inspired to find his own Heart of Darkness and live out his inner Kurtz, Tony rides up the Skrang River to visit with an Iban village.'
