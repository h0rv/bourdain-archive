summary: "Tony visits the \"Rust Belt\" cities of Baltimore; Detroit, and Buffalo, New York, accompanied by Zamir Gotta. In Baltimore they meet with several of the cast members of the television show The Wire. In Buffalo they meet one of the other runners-up of the \"FANatic\" contest, Nelson Starr, and see his rock band perform. Zamir is discovered to have become a celebrity in the US in his own right, as a result of his previous No Reservations appearances."
