summary: "Tony visits Ghana for the first time. In Accra, he samples food such as kenkey and palm wine at the bustling Makola Market, and meets tourism minister Jacob Otanka Obetsebi-Lamptey at the beach, where they help bring in a fish haul and enjoy prepared seafood such as barracuda. He then goes on a tour of the countryside, meeting shea nut harvesters, enjoying the highlife music of Koo Nimo, and seeing kente cloth spinners in action."
