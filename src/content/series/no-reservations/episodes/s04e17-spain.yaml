summary: 'Tony re-visits Spain (Barcelona and the northern region of Spain,) which he calls the most important food destination in the world. He visits the test kitchen of pastry chef Albert Adrià, Ferran''s brother, and the factory of pioneering chocolate maker Enric Rovira. At a farm, he enjoys roasted calçots during a "calçotada". He has bar tapas with chefs Juan Mari Arzak and his daughter, Elena, of the restaurant Arzak, in San Sebastián. He eats at the molecular gastronomy restaurant Mugaritz, the grill-based restaurant Etxebarri, and Arzak.'
