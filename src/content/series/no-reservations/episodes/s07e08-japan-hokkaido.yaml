summary: "Weeks before the March 2011 quake, Tony visits Hokkaido, Japan. In Sapporo, he tries Hokkaido style ramen, waikanae crab, and Uni-ikura Don (salmon roe & sea urchin over rice). He visits with the indigenous people of Hokkaido, the Ainu. Tony ends his trip dining at a ryokan enjoying a formal robatayaki. In the international edition, viewers saw Tony visit the Sapporo Beer Garden for the “Genghis Khan” which is a specialty of Hokkaido."
