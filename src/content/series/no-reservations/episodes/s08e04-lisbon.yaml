summary: "Once the center of the richest empire in Europe, Lisbon now faces one of the worst financial crises in the EU. But even as it struggles with rising debt and unemployment, Tony finds out that Lisbon is experiencing a cultural and culinary renaissance. Tony shares a meal and Fado performance with writer António Lobo Antunes. The music of Dead Combo is used throughout the episode and the band is featured in the episode as well, eating at a restaurant specialising in gourmet canned fish."
