summary: "Tony visits the state of Rajasthan in India. He visits the city of Udaipur and enjoys a vegetarian thali, then attends a dinner and lavish party hosted by the Maharana of Udaipur. He visits a local chef for a home-cooked meal and spends time with a guru in an ashram in the city of Jodhpur. He takes a long bus ride to the city of Jaisalmer and experiences the Jaisalmer Desert Festival."
