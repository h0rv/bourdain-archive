summary: "Tony's adventures takes him to the city of San Francisco, a city of districts and contradictions. So paying an homage to Steve McQueen's iconic 1968 film Bullitt; Tony takes his rented Ford Mustang through the streets of San Francisco, from Fisherman's Wharf, to Haight-Ashbury, to Chinatown, and across the bridge into Oakland, California. Tony dines with poet August Kleinzahler, and then off to chef Chris Cosentino's restaurant for an offal tasting."
