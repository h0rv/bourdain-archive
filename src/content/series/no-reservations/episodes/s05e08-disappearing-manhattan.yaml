summary: 'Tony visits old establishments in Manhattan that are becoming a rarity in the city. He visits several old food stores in Hell''s Kitchen with chef Michael Lomonaco, Keens Steakhouse with food writer Joshua Ozersky, Russ & Daughters and Katz''s Delicatessen with novelist Joel Rose, Eisenberg''s Sandwich and some of the German establishments in the Yorkville neighborhood with tour guide "Famous Fat Dave", Hop Kee in Chinatown with chef Chris Cheung, Le Veau d''Or with food writer Michael Batterberry, and dive bar Sophie''s with writer Nick Tosches.'
