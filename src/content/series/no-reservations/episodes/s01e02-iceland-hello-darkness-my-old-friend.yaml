summary: "This week Anthony travels to Reykjavík, Iceland, where in winter the volcanic islands see only about four hours of sunlight a day. Anthony finds the darkness comforting and learns how the Icelanders contend with the dark days - eating, drinking, spending time at the spa, and pumping iron! Tony tries Hákarl (fermented shark). Later, he visits the famous Blue Lagoon."
