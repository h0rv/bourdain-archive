summary: "A trip to Rio de Janeiro proves stressful for Anthony, who is nervous about his wife, Ottavia, competing in a jujitsu match. To unwind, he enjoys the Brazilian cocktail caipirinhas and a pork sandwich in Ipanema; and later, learns about improvements made in the shanty town Rocinha. Finally, the Bourdains enjoy a home-cooked stew made with filet mignon, garlic, onion, tomato, farofa and feijoada."
