summary: "Tony travels with food writer Michael Ruhlman to Cleveland, Ruhlman's home town. They have Cincinnati chili at Skyline Chili. Tony meets comic-book artist Harvey Pekar. He also visits the Rock and Roll Hall of Fame with Marky Ramone and spends time with chef Michael Symon, both at Symon's restaurant Lola and at a soul food restaurant. Parts of the episode are illustrated in Pekar's comic-book style."
