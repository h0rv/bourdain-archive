summary: "Tony visits the province of Quebec in Canada. He visits a duck farm with famed chef Martin Picard, then enjoys a decadent, foie gras-heavy meal at Picard's restaurant, Au Pied de Cochon in Montreal. He flies north to go seal hunting with the Inuit. He also enjoys poutine at La Banquise, sausages with maple syrup at a sugar house, and Montreal-style bagels, and learns to play hockey."
