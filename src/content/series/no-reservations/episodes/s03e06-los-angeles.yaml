summary: "Tony visits Los Angeles, in search of the local culture, away from the glitz and glamor of Hollywood. He dines at Roscoe's Chicken and Waffles with writer and screenwriter Jerry Stahl. He meets a women's roller derby team, and has French dip sandwiches with them at Philippe's, which claims to have invented the French dip sandwich. He eats at a Mexican restaurant with a mariachi band, and visits the neighborhood of Thai Town. Tony trains with the Hawthorne SWAT team."
