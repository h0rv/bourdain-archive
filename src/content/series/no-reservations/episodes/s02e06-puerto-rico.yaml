summary: "Tony visits Puerto Rico and tries to see the less-touristic side of the island. After a bad start drinking a piña colada at the bar where the drink was invented, he enjoys roast pork at a lechonera, as well as mofongo, goes scuba-diving in an unsuccessful attempt to catch a giant lobster, and tries horseback riding. He also searches for the mythical chupacabra and goes sparring with boxing champion Miguel Cotto. He visits a music festival and enjoys chicharrón in Bayamón."
